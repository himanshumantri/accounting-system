# Render Blueprint for the API. The database is an external Postgres (e.g. Neon):
# set DATABASE_URL in the Render dashboard (sync: false keeps it out of git).
services:
  - type: web
    name: open-accounting-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false   # your Vercel URL, e.g. https://open-accounting.vercel.app
      - key: RECURRING_RUN_TOKEN
        sync: false   # long random string; also set as a masked CI/CD variable in GitLab
